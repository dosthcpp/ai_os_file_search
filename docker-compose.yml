version: "3.9"

# ChromaDB를 독립 서버로 실행하고 싶을 때만 사용
# 기본값: search_api가 PersistentClient(로컬 임베디드)로 직접 접근
# 이 compose를 사용할 경우 apps/search_api/main.py의 get_chroma()를
# chromadb.HttpClient(host="localhost", port=8100)로 교체하세요.

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8100:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
